<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cal-bg">
        <div class="cal-container">
            <h1>Calculator</h1>
            <input title="display-screen" type="text" inputmode="numeric" id="display-screen" class="cal-input">
            <div class="cal-btns">
                <button class="percent-btn">%</button>
                <button class="ce-btn">CE</button>
                <button class="clear">C</button>
                <button class="del-btn">DEL</button>
                <button class="number-btn">7</button>
                <button class="number-btn">8</button>
                <button class="number-btn">9</button>
                <button class="operation-btn">/</button>
                <button class="number-btn">4</button>
                <button class="number-btn">5</button>
                <button class="number-btn">6</button>
                <button class="operation-btn">*</button>
                <button class="number-btn">1</button>
                <button class="number-btn">2</button>
                <button class="number-btn">3</button>
                <button class="operation-btn">-</button>
                <button class="number-btn">0</button>
                <button class="decimal-btn">.</button>
                <button class="equals-btn">=</button>
                <button class="operation-btn">+</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
